<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>Planning Gantt</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--fond:#F8F6F1;--vert:#234B3E;--grille:#DDD9CF;--encre:#2B2B26;--doux:#6B675E;
  --lanc:#C0623A;--depl:#A9862A;--bilan:#2F6A86}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#888;font-family:'Hanken Grotesk',sans-serif;color:var(--encre)}
.page{width:1600px;background:var(--fond);padding:50px 56px 44px}
.sur{font-weight:700;font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--vert)}
h1{font-family:'Bricolage Grotesque';font-weight:800;font-variation-settings:"wdth" 85;font-size:52px;letter-spacing:-.02em;color:var(--vert);margin-top:14px;line-height:1}
.sous{font-size:18px;color:var(--doux);margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:26px;table-layout:fixed}
col.a{width:330px}
th,td{border:1px solid var(--grille);text-align:center;font-size:14px}
thead th{background:var(--vert);color:#F3F0E8;font-weight:700;padding:8px 2px;letter-spacing:.04em}
thead th small{display:block;font-weight:500;font-size:12px;opacity:.85;letter-spacing:0;margin-top:2px}
thead tr.phase th{padding:9px 4px;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
thead tr.phase th.l{background:var(--lanc)}thead tr.phase th.d{background:var(--depl)}thead tr.phase th.b{background:var(--bilan)}
thead tr.phase th.vide{background:var(--fond);border-color:var(--fond)}
td{height:46px;background:#fff;position:relative}
td.nom{text-align:left;padding:6px 12px;font-weight:600;font-size:15px;line-height:1.2}
td.nom span{display:block;font-weight:500;font-size:12.5px;color:var(--doux);margin-top:2px}
tr.groupe td{background:#EFEBE2;height:30px;text-align:left;padding-left:12px;font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--vert)}
.barre{position:absolute;top:13px;bottom:13px;left:0;right:0;background:var(--c)}
.barre.debut{left:6px;border-radius:10px 0 0 10px}.barre.fin{right:6px;border-radius:0 10px 10px 0}.barre.seule{left:6px;right:6px;border-radius:10px}
.point{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--c);vertical-align:middle}
.legende{display:flex;gap:34px;margin-top:20px;font-size:14px;color:var(--doux);align-items:center;flex-wrap:wrap}
.legende i{display:inline-block;vertical-align:middle;margin-right:8px}
</style></head><body>
<section class="page" id="gantt">
  <div class="sur">Maison Pierre Oteiza / Planning de la campagne</div>
  <h1>Avril – juin 2027 : 12 semaines</h1>
  <div class="sous">Lancement de la saison touristique · une barre = action continue, un point = action ponctuelle</div>
  <table id="t"></table>
  <div class="legende">
    <span><i class="point" style="--c:var(--lanc)"></i>Lancement : notoriété (S1 à S4)</span>
    <span><i class="point" style="--c:var(--depl)"></i>Déploiement : engagement (S5 à S9)</span>
    <span><i class="point" style="--c:var(--bilan)"></i>Bilan : mesure (S10 à S12)</span>
  </div>
</section>
<script>
const sem=['5 avr.','12 avr.','19 avr.','26 avr.','3 mai','10 mai','17 mai','24 mai','31 mai','7 juin','14 juin','21 juin'];
const C=w=>w<=4?'var(--lanc)':w<=9?'var(--depl)':'var(--bilan)';
// [nom, détail, points[], barres[[debut,fin]]]
const lignes=[
 ['g','Médias'],
 ['Encart magazine local ou touristique','2 parutions : avril et mai',[1,5],[]],
 ['g','Digital'],
 ['Série vidéo « Une minute aux Aldudes »','Tournage S1, puis 1 épisode par semaine',[1],[[2,11]]],
 ['Calendrier éditorial Instagram et Facebook','Mardis Instagram, jeudis Facebook',[1,3,5,6,7,8,9,10,11,12],[]],
 ['Sponsorisation Meta Ads','Environ 1 000 € par mois',[],[[1,8]]],
 ['Microcréateurs','Accueil aux Aldudes S5, publications S5 à S7',[],[[5,7]]],
 ['g','Hors-médias'],
 ['Ateliers « Apéro basque »','6 sessions, une par semaine',[4,5,6,7,8,9],[]],
 ['Boutique éphémère chez un partenaire','Week-end des 22-23 mai',[7],[]],
 ['g','Mesure'],
 ['Relevé des KPI','Point d’étape à la fin de chaque phase',[4,9,12],[]],
 ['Analyse, bilan et ajustements','Préparation de novembre-décembre',[],[[10,12]]],
];
let h='<colgroup><col class="a">'+sem.map(()=>'<col>').join('')+'</colgroup><thead>';
h+='<tr class="phase"><th class="vide"></th><th class="l" colspan="4">Lancement</th><th class="d" colspan="5">Déploiement</th><th class="b" colspan="3">Bilan</th></tr>';
h+='<tr><th style="text-align:left;padding-left:12px">Action</th>'+sem.map((s,i)=>`<th>S${i+1}<small>${s}</small></th>`).join('')+'</tr></thead><tbody>';
for(const l of lignes){
  if(l[0]==='g'){h+=`<tr class="groupe"><td colspan="13">${l[1]}</td></tr>`;continue}
  const [n,d,pts,bars]=l;h+=`<tr><td class="nom">${n}<span>${d}</span></td>`;
  for(let w=1;w<=12;w++){
    let c='';const b=bars.find(([a,z])=>w>=a&&w<=z);
    if(b){const k=b[0]===b[1]?'seule':w===b[0]?'debut':w===b[1]?'fin':'';c=`<div class="barre ${k}" style="--c:${C(w)}"></div>`}
    else if(pts.includes(w))c=`<span class="point" style="--c:${C(w)}"></span>`;
    h+=`<td>${c}</td>`}
  h+='</tr>'}
document.getElementById('t').innerHTML=h+'</tbody>';
</script></body></html>
