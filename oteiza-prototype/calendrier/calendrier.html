<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>Calendrier éditorial</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--fond:#F8F6F1;--vert:#234B3E;--grille:#DDD9CF;--vide:#EEECE6;--encre:#2B2B26;--doux:#6B675E;
  --informer:#C0623A;--inspirer:#A9862A;--engager:#2F6A86;--garance:#AE2A2C}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#888;font-family:'Hanken Grotesk',sans-serif;color:var(--encre)}
.page{width:1600px;height:1080px;background:var(--fond);padding:56px 60px;position:relative;margin-bottom:20px}
.sur{font-weight:700;font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--vert)}
.ligne{display:flex;justify-content:space-between;align-items:flex-end;margin-top:22px}
h1{font-family:'Bricolage Grotesque';font-weight:800;font-variation-settings:"wdth" 85;font-size:64px;letter-spacing:-.02em;line-height:1;color:var(--vert)}
.sous{font-size:19px;color:var(--doux);margin-top:10px}
.legende{display:flex;gap:40px;padding-bottom:8px}
.legende span{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.legende i{width:14px;height:14px;border-radius:50%}
.legende .proto{color:var(--garance)}
.legende .proto i{border-radius:3px;background:none;border:2px solid var(--garance)}
table{width:100%;border-collapse:collapse;margin-top:30px;table-layout:fixed}
th{background:var(--vert);color:#F3F0E8;text-align:left;font-weight:700;font-size:14px;letter-spacing:.16em;text-transform:uppercase;padding:12px 14px}
td{border:1px solid var(--grille);height:92px;vertical-align:top;padding:10px 12px;background:#fff;position:relative}
td.vide{background:var(--vide)}
td .j{font-size:15px;color:var(--doux);font-variant-numeric:tabular-nums}
td.pub{padding-left:18px}
td.pub::before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:5px;background:var(--c)}
td.pub .t{font-weight:700;font-size:15px;line-height:1.25;color:var(--c);margin-top:4px}
td.pub .f{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--doux);margin-top:6px}
td.proto{outline:2.5px solid var(--garance);outline-offset:-3px}
td.proto .badge{position:absolute;top:8px;right:8px;background:var(--garance);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:4px}
.liste{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:14px 50px}
.item{display:grid;grid-template-columns:62px 1fr;gap:8px}
.item b.d{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.item .tt{font-weight:700;font-size:16px}
.item .ds{font-size:14.5px;color:var(--doux);margin-top:3px;line-height:1.35}
.pied{position:absolute;left:60px;right:60px;bottom:40px;display:flex;justify-content:space-between;font-size:14px;color:var(--doux)}
.pied b{color:var(--encre)}
</style></head><body>
<div id="out"></div>
<script>
const P={informer:'var(--informer)',inspirer:'var(--inspirer)',engager:'var(--engager)'};
const mois=[
 {id:'avril',nom:'Avril 2027',annee:2027,m:3,pubs:{
   6:{t:'Bien préparer une planche basque',f:'Instagram · Carrousel',p:'informer',proto:1,d:'Découpe, portions, présentation : les 3 gestes de nos artisans.'},
   8:{t:'Dans les coulisses de la Maison',f:'Facebook · Photo',p:'informer',d:'Le quotidien d’un artisan et les étapes de son travail.'},
   20:{t:'Un taloa pour le brunch du dimanche',f:'Instagram · Reel',p:'inspirer',d:'Une recette gourmande à préparer entre amis avec nos produits.'},
   22:{t:'Votre escapade idéale aux Aldudes',f:'Facebook · Photo',p:'engager',proto:1,d:'Balade, rencontre ou dégustation : réponse en commentaire.'}}},
 {id:'mai',nom:'Mai 2027',annee:2027,m:4,pubs:{
   4:{t:'Les secrets de l’affinage',f:'Instagram · Reel',p:'informer',d:'Le rôle du temps dans le goût du jambon.'},
   13:{t:'Une table entre amis au grand air',f:'Facebook · Photo',p:'inspirer',d:'Un moment convivial autour des produits, dans un paysage basque.'},
   18:{t:'Des bouchées basques à partager',f:'Instagram · Reel',p:'inspirer',d:'Des pintxos simples pour les premiers repas en terrasse.'},
   27:{t:'Votre coin préféré du Pays Basque',f:'Facebook · Photo',p:'engager',d:'La communauté partage ses lieux de pique-nique et un souvenir.'}}}];
const out=document.getElementById('out');
for(const M of mois){
  const first=new Date(M.annee,M.m,1),nb=new Date(M.annee,M.m+1,0).getDate();
  const off=(first.getDay()+6)%7;let cells=[];
  for(let i=0;i<off;i++)cells.push(null);for(let d=1;d<=nb;d++)cells.push(d);while(cells.length%7)cells.push(null);
  let rows='';for(let r=0;r<cells.length;r+=7){rows+='<tr>'+cells.slice(r,r+7).map(d=>{
    if(!d)return '<td class="vide"></td>';const p=M.pubs[d];
    if(!p)return `<td><div class="j">${d}</div></td>`;
    return `<td class="pub${p.proto?' proto':''}" style="--c:${P[p.p]}"><div class="j">${d}</div><div class="t">${p.t}</div><div class="f">${p.f}</div>${p.proto?'<span class="badge">Prototype</span>':''}</td>`}).join('')+'</tr>'}
  const liste=Object.entries(M.pubs).map(([d,p])=>`<div class="item"><b class="d" style="color:${P[p.p]}">${String(d).padStart(2,'0')}/${String(M.m+1).padStart(2,'0')}</b><div><div class="tt">${p.t}${p.proto?' <span style="color:var(--garance);font-size:13px;letter-spacing:.08em">· PROTOTYPE</span>':''}</div><div class="ds">${p.d}</div></div></div>`).join('');
  out.insertAdjacentHTML('beforeend',`<section class="page" id="${M.id}">
   <div class="sur">Maison Pierre Oteiza / Calendrier éditorial</div>
   <div class="ligne"><div><h1>${M.nom}</h1><div class="sous">Faire découvrir le terroir basque à une nouvelle génération</div></div>
   <div class="legende"><span style="color:var(--informer)"><i style="background:var(--informer)"></i>Informer</span><span style="color:var(--inspirer)"><i style="background:var(--inspirer)"></i>Inspirer</span><span style="color:var(--engager)"><i style="background:var(--engager)"></i>Engager</span><span class="proto"><i></i>Prototype</span></div></div>
   <table><tr>${['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'].map(j=>`<th>${j}</th>`).join('')}</tr>${rows}</table>
   <div class="liste">${liste}</div>
   <div class="pied"><span><b>Rythme fixe :</b> 1<sup>er</sup> et 3<sup>e</sup> mardis sur Instagram · 2<sup>e</sup> et 4<sup>e</sup> jeudis sur Facebook</span><span>4 publications par mois · 0 publication promotionnelle</span></div>
  </section>`);
}
</script></body></html>
