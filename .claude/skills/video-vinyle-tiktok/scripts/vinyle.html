  const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  cx.font = `400 28px ${FONT}`; cx.fillStyle = 'rgba(255,255,255,0.6)';
  cx.fillText(mmss(songT), x0, 1116); cx.textAlign = 'right'; cx.fillText('-' + mmss(cfg.songDuration - songT), x0 + MAXW, 1116); cx.textAlign = 'left';

  // ---- V1 scrolling list + V2 karaoke fill on the active line, timed from LRCLIB ----
  const T = cfg.times, n = lines.length;
  let idx = -1; for (let i = 0; i < n; i++) if (t >= T[i]) idx = i;
  const lineEnd = i => (i + 1 < n ? T[i + 1] : cfg.end);
  const since = idx >= 0 ? t - T[idx] : 0;
  // cumulative positions from each line's real wrapped height (measured at the active size)
  const ACT = 78, BASE = 58, GAPL = 26;
  const pos = [0];
  for (let i = 0; i < n; i++) {
    cx.font = `700 ${ACT}px ${FONT}`; const sp = cx.measureText(' ').width; let rowsN = 1, ww = 0;
    words[i].forEach(word => { const m = cx.measureText(word).width; if (ww && ww + sp + m > MAXW) { rowsN++; ww = m; } else ww += (ww ? sp : 0) + m; });
    pos.push(pos[i] + rowsN * ACT * 1.1 + GAPL);
  }
  const scrollY = idx <= 0 ? 0 : pos[idx - 1] + (pos[idx] - pos[idx - 1]) * easeIO(since / 0.3);
  const y0 = 1245, top = 1155, bottom = 1470;
  cx.save(); cx.beginPath(); cx.rect(0, top, W, bottom - top); cx.clip();
  for (let i = 0; i < n; i++) {
    const y = y0 + pos[i] - scrollY;
    if (y < top - 250 || y > bottom + 150) continue;
    const active = i === idx;
    const k = active ? easeOut(since / 0.25) : 0;
    const size = BASE + (ACT - BASE) * k;
    const edge = clamp(Math.min(y - top, bottom - y) / 90, 0, 1);
    cx.font = `700 ${size}px ${FONT}`;
    const space = cx.measureText(' ').width;
    // wrap words into rows
    const rows = [[]]; let w = 0;
    words[i].forEach(word => { const ww = cx.measureText(word).width; if (rows[rows.length - 1].length && w + space + ww > MAXW) { rows.push([]); w = 0; } rows[rows.length - 1].push({ word, ww }); w += (rows[rows.length - 1].length > 1 ? space : 0) + ww; });
    const dur = lineEnd(i) - T[i], prog = active ? clamp(since / (dur * 0.9), 0, 1) : (i < idx ? 1 : 0);
    const nw = words[i].length; let kk = 0;
    rows.forEach((row, r) => {
      let x = x0;
      row.forEach(o => {
        const on = clamp(prog * nw - kk, 0, 1);
        let col, a;
        if (active) { col = on > 0 ? (on >= 1 ? '255,255,255' : null) : '255,255,255'; a = on > 0 ? 1 : 0.38; }
        else { col = '255,255,255'; a = i < idx ? 0.26 : 0.4; }
        cx.globalAlpha = a * edge;
        cx.fillStyle = col ? `rgb(${col})` : accent;
        cx.fillText(o.word, x, y + r * size * 1.1);
        x += o.ww + space; kk++;
      });
    });
    cx.globalAlpha = 1;
  }
  cx.restore();

  return comp.toDataURL('image/jpeg', 0.9);
};
